version: '3.8'

services:
  # Relational Database with PgVector support
  postgres:
    image: pgvector/pgvector:pg15
    container_name: amazonlite-postgres
    environment:
      POSTGRES_USER: amazonlite_user
      POSTGRES_PASSWORD: amazonlite_password
      POSTGRES_DB: amazonlite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB for CQRS Read Projections
  mongodb:
    image: mongo:6.0
    container_name: amazonlite-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: amazonlite_catalog
    volumes:
      - mongo_data:/data/db

  # Redis for Caching & Session Management
  redis:
    image: redis:7-alpine
    container_name: amazonlite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Apache Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: amazonlite-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

volumes:
  postgres_data:
  mongo_data:
  redis_data: